project:
  name: MyERP
  outputPath: output

pdf:
  coordinateTolerance: 0.04
  imageFallback: true
  dpi: 150

validation:
  visualSimilarityTarget: 0.95
  maxAgentIterations: 3
  maxDiagnosisRetries: 3
  requirePassingLogicTests: true
  confidenceThreshold: 0.85
  confidenceTiers:
    high: 0.90
    medium: 0.70

security:
  allowedInputDirs:
    - samples
    - uploads
    - tmp
    - output
  allowedOutputDirs:
    - output
    - samples
    - tmp
  allowedExtensions:
    - .pdf
    - .rdlc
    - .vb
    - .xlsx
    - .json
    - .vbproj
    - .csproj
