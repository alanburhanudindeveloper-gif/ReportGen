project:
  name: MyERP
  outputPath: output

pdf:
  coordinateTolerance: 0.04
  imageFallback: true
  dpi: 144

ai:
  enabled: true
  # Default 'none': VS Code / host AI Agent owns model selection & auth; ReportGen runs deterministically.
  # Optional explicit opt-in providers: gemini | openai | openai-compatible | claude | none
  # Overridable via environment variables: LLM_PROVIDER, LLM_MODEL, LLM_BASE_URL
  provider: none
  model: deterministic-only
  timeoutMs: 25000
  maxRetries: 1
  confidenceThreshold: 0.85
  confidenceTiers:
    high: 0.90
    medium: 0.70

validation:
  visualSimilarityTarget: 0.95
  maxAgentIterations: 3
  maxDiagnosisRetries: 3
  requirePassingLogicTests: true

security:
  allowedInputDirs:
    - samples
    - uploads
    - tmp
    - output
  allowedOutputDirs:
    - output
    - samples
    - tmp
  allowedExtensions:
    - .pdf
    - .rdlc
    - .vb
    - .xlsx
    - .json
    - .vbproj
    - .csproj
